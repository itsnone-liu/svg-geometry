<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MathViz P1 Player Harness — minimal-motion</title>
<style>
  body { background: #010409; color: #c9d1d9; font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; }
  #stage svg { display: block; border: 1px solid #21262d; border-radius: 6px; }
  .bar { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #30363d; }
  input[type=range] { width: 320px; }
  .mono { font-family: ui-monospace, monospace; color: #8b949e; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <button id="btn-play">play</button>
  <button id="btn-pause">pause</button>
  <input id="scrub" type="range" min="0" max="240" step="1" value="0">
  <span class="mono" id="clock">t=0.000</span>
</div>
<script>
window.__MATHVIZ_PROJECT__ = {
  "manifest": {
    "schema_version": "mathviz.project/v1",
    "engine_version": "0.1.0",
    "domain_versions": { "motion1d": "0.1.0" },
    "adapter_versions": {},
    "capability_registry_version": "1.0.0",
    "source_problem": "P1-SYNTHETIC-001",
    "problem_id": "p1-minimal-motion"
  },
  "math": {
    "schemaVersion": "mathviz.math/v1",
    "problemId": "p1-minimal-motion",
    "domain": "motion1d",
    "statement": "点P沿轨道从左端匀速运动到右端，参数u从0变到1。",
    "parameters": [
      { "id": "u", "min": { "kind": "int", "value": "0" }, "max": { "kind": "int", "value": "1" }, "default": { "kind": "int", "value": "0" } }
    ],
    "entities": [
      { "id": "P_point", "kind": "point", "props": { "axis": "x" } },
      { "id": "track_seg", "kind": "segment", "props": { "axis": "x" } }
    ],
    "source_facts": [
      {
        "fact_id": "u_range",
        "name": "参数范围",
        "value": 1,
        "provenance": { "kind": "problem_text", "span": { "text": "参数u从0变到1", "start": 16, "end": 24 } }
      }
    ],
    "derived_facts": [],
    "runtime_values": [
      { "id": "pos_P", "expr": { "t": "sym", "name": "t" }, "depends_on": [] }
    ],
    "constraints": [],
    "assertions": [],
    "capabilities": ["motion1d.constant_velocity"]
  },
  "scene": {
    "schemaVersion": "mathviz.scene/v1",
    "sceneId": "scene-p1-minimal",
    "viewport": { "width": 800, "height": 200, "margin": [20, 20, 20, 20] },
    "objects": [
      { "objectId": "obj_track", "primitive": "segment", "binding": { "source": "math:entity:track_seg" }, "style": { "stroke": "#30363d" } },
      { "objectId": "obj_P", "primitive": "point", "binding": { "source": "math:runtime:pos_P" }, "label": "P", "style": { "fill": "#58a6ff" } },
      { "objectId": "obj_note", "primitive": "text", "binding": { "source": "math:fact:u_range" }, "text": "u: 0 → 1" }
    ],
    "bindings": []
  },
  "timeline": {
    "schemaVersion": "mathviz.timeline/v1",
    "timelineId": "tl-p1-minimal",
    "duration": 8,
    "fps": 30,
    "tracks": [
      {
        "track_id": "clock",
        "actions": [
          { "kind": "map_model_time", "from": 2, "to": 6, "model_from": { "t": "num", "v": { "kind": "int", "value": "0" } }, "model_to": { "t": "num", "v": { "kind": "int", "value": "1" } }, "easing": "linear" }
        ]
      },
      {
        "track_id": "reveal",
        "actions": [
          { "kind": "show", "target": "obj_P", "at": 0 },
          { "kind": "caption", "at": 0.5, "text": "presentation-only 区间（无模型时间）", "until": 2 },
          { "kind": "caption", "at": 6, "text": "模型时间已结束", "until": 7.5 }
        ]
      }
    ]
  }
};
</script>
<script src="./dist/runtime.bundle.js"></script>
<script>
(function () {
  var rt = MathVizRuntime.loadRuntime(window.__MATHVIZ_PROJECT__);
  var player = rt.createPlayer();
  var stage = document.getElementById("stage");
  var clock = document.getElementById("clock");
  var scrub = document.getElementById("scrub");
  var lastFrame = null;
  var maxFrame = Math.floor(rt.duration * rt.fps);
  scrub.max = String(maxFrame);

  function render() {
    var state = player.getState(); // ALWAYS via stateAt — pure recompute
    var frame = Math.round(state.presentationTime * rt.fps);
    stage.innerHTML = MathVizRuntime.renderSvg(state, window.__MATHVIZ_PROJECT__.scene);
    clock.textContent = "t=" + state.presentationTime.toFixed(3) + "  model=" +
      (state.modelTime === null ? "null" : state.modelTime.toFixed(4));
    if (document.activeElement !== scrub) scrub.value = String(frame);
    // The video pipeline waits on exactly these attributes — nothing else.
    document.body.setAttribute("data-rendered-frame", String(frame));
    document.body.setAttribute("data-state-digest", state.digest);
    lastFrame = frame;
  }

  window.mathviz = {
    seek: function (s) { player.seek(s); render(); },
    play: function () { player.play(); },
    pause: function () { player.pause(); render(); },
    setFrame: function (n) { player.setFrame(n); render(); },
    getState: function () { return player.getState(); }
  };

  var lastTs = null;
  function loop(ts) {
    if (player.playing) {
      if (lastTs !== null) player.tick(Math.min((ts - lastTs) / 1000, 0.25));
      render();
    }
    lastTs = ts;
    requestAnimationFrame(loop);
  }

  document.getElementById("btn-play").addEventListener("click", function () { window.mathviz.play(); });
  document.getElementById("btn-pause").addEventListener("click", function () { window.mathviz.pause(); });
  scrub.addEventListener("input", function () { player.setFrame(parseInt(scrub.value, 10)); render(); });

  // headless harness entry: index.html?frame=N renders exactly frame N
  var m = /frame=(\d+)/.exec(location.search || "");
  if (m) window.mathviz.setFrame(parseInt(m[1], 10));
  else render();
  requestAnimationFrame(loop);
  void lastFrame;
})();
</script>
</body>
</html>
